
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">
  <title>DNA Enhancer Simulator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>DNA Enhancer Simulator</h1>
    <p>원거리 조절부위의 접촉 성공률 분석</p>
  </header>

  <main>
    <section>
      <h2>DNA 접힘 시뮬레이션</h2>

      <canvas
        id="dnaCanvas"
        width="900"
        height="400">
      </canvas>

      <p id="status">시뮬레이션 대기 중</p>
    </section>

    <section>
      <h2>실험 변인 설정</h2>

      <label for="force">상호작용 세기</label>
      <input
        type="range"
        id="force"
        min="0"
        max="100"
        value="50">
      <span id="forceValue">50</span>

      <label for="distance">DNA상 거리</label>
      <input
        type="range"
        id="distance"
        min="10"
        max="100"
        value="50">
      <span id="distanceValue">50</span>

      <label for="flexibility">DNA 유연성</label>
      <input
        type="range"
        id="flexibility"
        min="0"
        max="100"
        value="50">
      <span id="flexibilityValue">50</span>

      <button id="runBtn">
        시뮬레이션 실행
      </button>
    </section>

    <section>
      <h2>실험 결과</h2>

      <p>
        반복 실험 횟수:
        <strong id="trialCount">2,000회</strong>
      </p>

      <p>
        접촉 성공 횟수:
        <strong id="successCount">-</strong>
      </p>

      <p>
        표적 접촉 확률:
        <strong id="targetResult">-</strong>
      </p>

      <button id="downloadBtn">
        결과 CSV 저장
      </button>
    </section>

    <section>
      <h2>실험 모델 안내</h2>
      <p>
        본 프로그램은 DNA의 접힘과
        인핸서-프로모터 접촉을 단순화한
        교육용 확률 시뮬레이션입니다.
      </p>
      <p>
        상호작용 세기, DNA상 거리, 유연성은
        실제 측정된 물리량이 아닌
        모형상의 상대적인 변수입니다.
        계산된 접촉 확률은 실제 생물학적
        결합 확률을 의미하지 않습니다.
      </p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
